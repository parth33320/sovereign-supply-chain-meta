services:
  - type: web
    name: sovereign-supply-chain
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      pip install -r requirements.txt &&
      python init_db.py &&
      cd frontend && npm ci && npm run build
    startCommand: >
      cd backend &&
      uvicorn main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: META_MODEL_NAME
        value: muse-spark-1.3
      - key: ADMIN_SECRET
        sync: false
      - key: PYTHONPATH
        value: .
