services:
  - type: web
    name: sovereign-supply-chain
    env: docker
    region: oregon
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: META_MODEL_NAME
        value: muse-spark-1.3
      - key: PYTHONPATH
        value: .
