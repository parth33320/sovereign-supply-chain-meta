services:
  # 1. Streamlit Web Dashboard Service
  - type: web
    name: sovereign-supply-chain-meta
    env: python
    plan: free
    region: oregon
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "1"
      - key: META_MODEL_NAME
        value: muse-spark-1.3
      - key: POSTGRES_DB_URI
        sync: false
      - key: META_API_KEY
        sync: false
      - key: META_API_BASE_URL
        sync: false
