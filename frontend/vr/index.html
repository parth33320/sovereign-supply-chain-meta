<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Supply Chain AR Walk — Sovereign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #0d1117; --surface: rgba(22,27,34,0.92); --border: rgba(48,54,61,0.9);
      --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
      --ok: #3fb950; --warn: #d29922; --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden; }

    #webgl-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    /* DOM Overlay root — 2D HUD only, shelf is 3D WebGL */
    #overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .interactive { pointer-events: auto; }

    .hud-top { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .status-pill { background: var(--surface); border: 1px solid var(--border);
      backdrop-filter: blur(12px); padding: 8px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 500; color: var(--text);
      display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .status-dot.warn { background: var(--warn); }

    .voice-feedback { background: rgba(13,17,23,.94); border: 1px solid var(--accent);
      border-radius: 12px; padding: 10px 14px; max-width: 420px; width: 100%;
      font-size: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.55); display: none; }
    .voice-feedback.visible { display: block; }
    .voice-feedback__heard { color: var(--muted); margin-bottom: 4px; }
    .voice-feedback__intent { color: var(--accent); font-weight: 600; }

    /* 2D desktop fallback shelf */
    #ar-scene { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 12px 0; }
    body.xr-active #ar-scene { display: none !important; }

    .hero-card { background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; max-width: 420px; width: 100%;
      text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    .hero-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .hero-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

    .btn { border: none; border-radius: 10px; padding: 11px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; transition: transform .12s ease, opacity .15s ease; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #238636; color: #fff; width: 100%; }
    .btn-accent { background: var(--accent); color: #0d1117; }
    .btn-danger { background: #da3633; color: #fff; }
    .btn-ghost { background: rgba(48,54,61,.65); color: var(--text); border: 1px solid var(--border); }

    .shelf-preview { background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px; max-width: 420px; width: 100%; }
    .shelf-preview__hdr { display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 600; margin-bottom: 12px; color: var(--accent); }
    .bin-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .bin-tile { background: rgba(13,17,23,.85); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; font-size: 12px; }
    .bin-tile.empty { border-color: var(--danger); cursor: pointer; }
    .bin-tile.low { border-color: var(--warn); }
    .bin-tile.ok { border-color: rgba(63,185,80,.45); }
    .bin-tile__top { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
    .bin-tile__hint { font-size: 11px; color: var(--danger); margin-top: 4px; }

    /* Modal panel */
    #ar-panel-backdrop { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: flex-end; padding: 16px; pointer-events: none;
      visibility: hidden; }
    #ar-panel-backdrop.open { visibility: visible; pointer-events: none; }
    #ar-panel-backdrop.open .card { pointer-events: auto; }
    /* On desktop/2D, panel slides to right so shelf stays visible */
    @media (min-width: 500px) {
      #ar-panel-backdrop { align-items: flex-start; padding-top: 60px; }
    }
    .card { background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(16px);
      border-radius: 16px; max-width: 420px; width: 100%; padding: 18px;
      box-shadow: 0 20px 48px rgba(0,0,0,.7); animation: cardPop .2s ease-out; }
    .card--warn { border-color: var(--warn); }
    .card--ok { border-color: var(--ok); }
    .card--danger { border-color: var(--danger); }
    .card--accent { border-color: var(--accent); }
    @keyframes cardPop { from { opacity:0; transform: translateY(10px) scale(.98); } to { opacity:1; transform: none; } }
    .card__header { display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; }
    .card__title { font-size: 14px; font-weight: 700; }
    .card__badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
      background: rgba(88,166,255,.16); color: var(--accent); }
    .card__body { font-size: 13px; line-height: 1.55; }
    .card__line { padding: 4px 0; font-size: 12.5px; }
    .card__box { background: rgba(13,17,23,.85); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 12px; }
    .card__row { display: flex; justify-content: space-between; padding: 3px 0; }
    .card__actions { display: flex; gap: 10px; margin-top: 14px; }
    .card__actions .btn { flex: 1; }

    .hud-bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; position: relative; z-index: 20; }
    .controls-row { display: flex; gap: 8px; max-width: 420px; width: 100%; }
    .controls-row .btn { flex: 1; }
    .voice-hints { font-size: 11px; color: var(--muted); text-align: center;
      background: rgba(13,17,23,.8); padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="overlay">
    <div class="hud-top">
      <div class="status-pill interactive" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Supply Chain AR · Ready</span>
      </div>
      <div class="voice-feedback interactive" id="voice-feedback"></div>
    </div>

    <!-- 2D desktop / pre-AR fallback -->
    <div id="ar-scene">
      <div class="hero-card interactive">
        <div class="hero-title">Supply Chain AR Walk</div>
        <div class="hero-sub">Floor-Anchored 3D Shelf · WebXR Hit-Test · Muse AI</div>
        <button class="btn btn-primary interactive" id="btn-enter-ar">🏭 Enter AR Walk</button>
      </div>
      <div class="shelf-preview interactive">
        <div class="shelf-preview__hdr"><span>Supply Chain Shelf</span><span>Live Sync</span></div>
        <div class="bin-grid" id="desktop-bin-grid"></div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="controls-row">
        <button class="btn btn-accent interactive" id="btn-mic">🎤 Voice</button>
        <button class="btn btn-ghost interactive" id="btn-reset">🔄 Reset</button>
      </div>
      <div class="voice-hints">Say: "restock Widget-A" · "approve PO" · "pay invoice"</div>
    </div>

    <!-- Modal panel INSIDE #overlay — required for WebXR DOM overlay to render it -->
    <div id="ar-panel-backdrop">
      <div id="ar-panel"></div>
    </div>
  </div>

  <script>
  // ── Fallback data ─────────────────────────────────────────────────────────
  const FALLBACK_SHELF_SCAN = {
    type:"shelf", summary:"Bay A-14: 2 of 4 SKUs need attention.", action_required:true,
    zones:[
      {sku:"Widget-A",qty:0, status:"empty",color:"#ff3333"},
      {sku:"Widget-B",qty:3, status:"low",  color:"#ffaa00"},
      {sku:"Widget-C",qty:18,status:"ok",   color:"#00ff88"},
      {sku:"Widget-D",qty:24,status:"ok",   color:"#00ff88"}
    ]
  };
  const FALLBACK_DRAFT_PO = {
    po_id:"PO-2026-847", supplier:"Apex Logistics", sku:"Widget-A",
    qty:500, unit_price:8.20, total:4100.00, delivery_days:3
  };
  const FALLBACK_INVOICE = {
    type:"invoice", supplier:"Apex Logistics", dates:["2026-11-14","2026-11-17"],
    items:[{sku:"Widget-A",qty:500,cost:"8.20"}], total:"$4,100.00",
    draft_instruction:"Approve PO for 500x Widget-A from Apex Logistics at $8.20/unit. Delivery in 3 days."
  };
  const INITIAL_BINS = [
    {sku:"Widget-A",qty:0, status:"empty",color:"#ff3333"},
    {sku:"Widget-B",qty:3, status:"low",  color:"#ffaa00"},
    {sku:"Widget-C",qty:18,status:"ok",   color:"#00ff88"},
    {sku:"Widget-D",qty:24,status:"ok",   color:"#00ff88"},
    {sku:"Widget-E",qty:30,status:"ok",   color:"#00ff88"},
    {sku:"Widget-F",qty:12,status:"ok",   color:"#00ff88"},
    {sku:"Widget-G",qty:28,status:"ok",   color:"#00ff88"},
    {sku:"Widget-H",qty:9, status:"low",  color:"#ffaa00"}
  ];
  const INTENT_LABELS = {
    restock:"Restock Widget-A (A2A)", approve_po:"Approve PO",
    reject_po:"Reject PO", pay_invoice:"Pay Invoice",
    show_invoice:"Open Invoice", unknown:"Unknown"
  };

  // ── App state ─────────────────────────────────────────────────────────────
  let bins = JSON.parse(JSON.stringify(INITIAL_BINS));
  let pendingPO = null, approvedPO = null, activeInvoice = null;
  let invoiceLocked = true, isNegotiating = false;

  // ── Three.js setup ────────────────────────────────────────────────────────
  const canvas = document.getElementById("webgl-canvas");
  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.3));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(1,3,2); scene.add(dir);

  // Floor reticle (blue ring — only visible on horizontal surfaces)
  const reticleGeo = new THREE.RingGeometry(0.12, 0.17, 32).rotateX(-Math.PI/2);
  const reticle = new THREE.Mesh(reticleGeo,
    new THREE.MeshBasicMaterial({color:0x0066ff, side:THREE.DoubleSide}));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // 3D shelf group (placed at floor hit-test position, stays in world space)
  const shelfGroup = new THREE.Group();
  shelfGroup.visible = false;
  scene.add(shelfGroup);

  let binMeshes = {};
  let widgetAMesh = null;

  function createLabelTexture(title, subtitle, bgColor, borderColor) {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 192;
    const ctx = c.getContext("2d");
    ctx.fillStyle = bgColor || "#0d1117";
    ctx.fillRect(0,0,512,192);
    ctx.strokeStyle = borderColor || "#58a6ff";
    ctx.lineWidth = 10;
    ctx.strokeRect(5,5,502,182);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(title, 256, 78);
    ctx.fillStyle = borderColor || "#58a6ff";
    ctx.font = "600 34px sans-serif";
    ctx.fillText(subtitle, 256, 138);
    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  function build3DShelf() {
    while (shelfGroup.children.length) shelfGroup.remove(shelfGroup.children[0]);
    binMeshes = {}; widgetAMesh = null;

    const W=1.1, H=1.45, D=0.38;
    const postGeo = new THREE.BoxGeometry(0.035, H, 0.035);
    const postMat = new THREE.MeshStandardMaterial({color:0x484f58, metalness:0.7, roughness:0.35});
    [[-W/2,H/2,-D/2],[W/2,H/2,-D/2],[-W/2,H/2,D/2],[W/2,H/2,D/2]].forEach(([x,y,z])=>{
      const p = new THREE.Mesh(postGeo, postMat);
      p.position.set(x,y,z); shelfGroup.add(p);
    });

    // Header sign
    const hdrTex = createLabelTexture("BAY A-14 · AISLE 3","Tap Widget-A to Restock","#0d1117","#58a6ff");
    const hdr = new THREE.Mesh(new THREE.BoxGeometry(0.95,0.22,0.02),
      new THREE.MeshBasicMaterial({map:hdrTex}));
    hdr.position.set(0, H+0.14, 0); shelfGroup.add(hdr);

    // 2 shelf planks + 8 SKU boxes
    const plankGeo = new THREE.BoxGeometry(W+0.02, 0.025, D+0.02);
    const plankMat = new THREE.MeshStandardMaterial({color:0x21262d, roughness:0.7});
    [0.85, 0.32].forEach((sy, rowIdx) => {
      const plank = new THREE.Mesh(plankGeo, plankMat);
      plank.position.set(0, sy, 0); shelfGroup.add(plank);
      for (let col=0; col<4; col++) {
        const idx = rowIdx*4 + col;
        const bin = bins[idx];
        if (!bin) continue;
        const bx = -0.39 + col*0.26;
        const by = sy + 0.12;
        const boxGeo = new THREE.BoxGeometry(0.21, 0.20, 0.28);
        const col3 = new THREE.Color(bin.color);
        const boxMat = new THREE.MeshStandardMaterial({
          color: col3,
          emissive: bin.sku==="Widget-A" ? col3 : new THREE.Color(0),
          emissiveIntensity: bin.sku==="Widget-A" ? 0.35 : 0,
          roughness: 0.45
        });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(bx, by, 0);
        box.userData = {sku: bin.sku};
        const sub = bin.status==="empty" ? "0 u · TAP RESTOCK"
                  : bin.status==="inbound" ? "500 u · INBOUND"
                  : bin.status==="awaiting-invoice" ? "PO APPROVED · VALIDATE INV"
                  : bin.qty+" u";
        const labelTex = createLabelTexture(bin.sku, sub, "#0d1117", bin.color);
        const label = new THREE.Mesh(new THREE.PlaneGeometry(0.19,0.08),
          new THREE.MeshBasicMaterial({map:labelTex}));
        label.position.set(0, 0, 0.142);
        box.add(label); shelfGroup.add(box);
        binMeshes[bin.sku] = {mesh:box, labelMesh:label};
        if (bin.sku==="Widget-A") widgetAMesh = box;
      }
    });
  }
  build3DShelf();

  function update3DBin(sku, newQty, newStatus, newColor) {
    const entry = binMeshes[sku]; if (!entry) return;
    const col3 = new THREE.Color(newColor);
    entry.mesh.material.color.copy(col3);
    entry.mesh.material.emissive.setHex(newStatus==="empty"?0xff3333:0);
    entry.mesh.material.emissiveIntensity = newStatus==="empty"?0.35:0;
    const sub = newStatus==="inbound" ? "500 u · INBOUND"
              : newStatus==="awaiting-invoice" ? "PO APPROVED · VALIDATE INV"
              : newStatus==="empty" ? "0 u · TAP RESTOCK" : newQty+" u";
    const tex = createLabelTexture(sku, sub, "#0d1117", newColor);
    entry.labelMesh.material.map.dispose();
    entry.labelMesh.material.map = tex;
    entry.labelMesh.material.needsUpdate = true;
  }

  // ── WebXR hit-test state ──────────────────────────────────────────────────
  let xrSession = null, xrRefSpace = null;
  let hitTestSource = null, hitTestSourceRequested = false, shelfPlaced = false;
  const raycaster = new THREE.Raycaster();

  // Block DOM overlay touches from leaking to 3D select
  document.querySelectorAll(".interactive").forEach(el => {
    el.addEventListener("beforexrselect", ev => ev.preventDefault());
  });

  // On tap: first tap places shelf at reticle, subsequent taps raycast into shelf
  function onXRSelect(event) {
    if (!shelfPlaced) {
      if (reticle.visible) {
        // Lock shelf to this world-space floor position
        shelfGroup.position.setFromMatrixPosition(reticle.matrix);
        const camPos = new THREE.Vector3();
        camera.getWorldPosition(camPos);
        shelfGroup.lookAt(camPos.x, shelfGroup.position.y, camPos.z);
        shelfGroup.visible = true;
        shelfPlaced = true;
        reticle.visible = false;
        setStatus("Shelf anchored · Tap Widget-A to scan/restock");
      }
      return;
    }
    // Raycast against shelf boxes
    const frame = event.frame;
    if (!frame || !xrRefSpace || !shelfGroup.visible) return;
    const pose = frame.getPose(event.inputSource.targetRaySpace, xrRefSpace);
    if (!pose) return;
    const mat4 = new THREE.Matrix4().fromArray(pose.transform.matrix);
    const origin = new THREE.Vector3().setFromMatrixPosition(mat4);
    const quat = new THREE.Quaternion(
      pose.transform.orientation.x, pose.transform.orientation.y,
      pose.transform.orientation.z, pose.transform.orientation.w);
    const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(quat);
    raycaster.set(origin, fwd);
    const hits = raycaster.intersectObjects(shelfGroup.children, true);
    if (hits.length > 0) onShelfPinch();
  }

  async function startARSession() {
    if (!navigator.xr) {
      setStatus("WebXR unavailable · 2D fallback mode", true); return;
    }
    try {
      xrSession = await navigator.xr.requestSession("immersive-ar", {
        requiredFeatures: ["hit-test","local-floor"],
        optionalFeatures: ["dom-overlay","hand-tracking"],
        domOverlay: {root: document.getElementById("overlay")}
      });
      renderer.xr.setReferenceSpaceType("local-floor");
      await renderer.xr.setSession(xrSession);
      xrRefSpace = await xrSession.requestReferenceSpace("local-floor");
      xrSession.addEventListener("select", onXRSelect);
      xrSession.addEventListener("end", () => {
        xrSession = null; hitTestSource = null;
        hitTestSourceRequested = false; shelfPlaced = false;
        shelfGroup.visible = false; reticle.visible = false;
        document.body.classList.remove("xr-active");
        setStatus("Supply Chain AR · Ready");
      });
      document.body.classList.add("xr-active");
      setStatus("📱 Point at floor · tap when blue ring appears", true);
      renderer.setAnimationLoop(onXRFrame);
    } catch(err) {
      console.error("XR failed:", err);
      setStatus("AR unavailable · 2D fallback mode", true);
    }
  }

  function onXRFrame(time, frame) {
    if (!frame || !xrSession) return;

    // Pulse Widget-A when empty
    if (widgetAMesh && bins[0] && bins[0].status === "empty") {
      widgetAMesh.material.emissiveIntensity = 0.25 + 0.35*Math.sin(time*0.006);
    }

    // Request hit-test source once per session
    if (!hitTestSourceRequested) {
      hitTestSourceRequested = true;
      xrSession.requestReferenceSpace("viewer").then(viewerSpace => {
        xrSession.requestHitTestSource({space: viewerSpace}).then(src => {
          hitTestSource = src;
        });
      }).catch(()=>{});
    }

    // Show reticle only on horizontal floor surfaces (normalY > 0.75)
    if (hitTestSource && !shelfPlaced && xrRefSpace) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length > 0) {
        const pose = hits[0].getPose(xrRefSpace);  // FIX: hits[0] not hits
        if (pose && pose.transform.matrix[5] > 0.75) {  // FIX: matrix[5] not matrix
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
          setStatus("🔵 Floor detected · Tap to place shelf");
        } else {
          reticle.visible = false;
          setStatus("📱 Point at floor · tap when blue ring appears", true);
        }
      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);
  }

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── DOM references ────────────────────────────────────────────────────────
  const statusText = document.getElementById("status-text");
  const statusDot  = document.getElementById("status-dot");
  const voiceFB    = document.getElementById("voice-feedback");
  const panelBD    = document.getElementById("ar-panel-backdrop");
  const arPanel    = document.getElementById("ar-panel");
  const dbGrid     = document.getElementById("desktop-bin-grid");

  function setStatus(text, isWarn=false) {
    statusText.textContent = text;
    statusDot.classList.toggle("warn", isWarn);
  }

  // ── Desktop 2D fallback ───────────────────────────────────────────────────
  function renderDesktopBins() {
    dbGrid.innerHTML = bins.map(b => {
      const hint = b.sku==="Widget-A"
        ? (invoiceLocked ? "<div class='bin-tile__hint'>👆 Tap to restock</div>"
                        : "<div class='bin-tile__hint'>🧾 Tap for invoice</div>")
        : "";
      const qty = b.status==="inbound" ? "500 u · Inbound"
              : b.status==="awaiting-invoice" ? "Validate Invoice →"
              : b.qty+" u";
      return `<div class="bin-tile ${b.status}" data-sku="${b.sku}">
        <div class="bin-tile__top"><span>${b.sku}</span><span style="color:${b.color}">${qty}</span></div>
        ${hint}</div>`;
    }).join("");
    const tile = dbGrid.querySelector('[data-sku="Widget-A"]');
    if (tile) tile.addEventListener("click", onShelfPinch);
  }
  renderDesktopBins();

  // ── Panel system ──────────────────────────────────────────────────────────
  function openPanel(html, accent="accent") {
    arPanel.innerHTML = `<div class="card card--${accent}">${html}</div>`;
    panelBD.classList.add("open");
    arPanel.querySelectorAll("button").forEach(btn =>
      btn.addEventListener("beforexrselect", ev => ev.preventDefault()));
  }
  function closePanel() { panelBD.classList.remove("open"); }

  // ── Supply chain workflows ────────────────────────────────────────────────
  function onShelfPinch() {
    if (!invoiceLocked) { onInvoicePinch(); return; }
    triggerAgentRestock();
  }

  // A2A negotiation log — populated from /api/vr/negotiate (Muse or fallback)
  let a2aLog = [
    {icon:"🔍", text:"Widget-A: <strong>0 units</strong> — restock triggered"},
    {icon:"📡", text:"RFQ broadcast to 3 registered suppliers"},
    {icon:"💬", text:"Apex Logistics bid: <strong>$8.20/u · 3 days</strong>"},
    {icon:"💬", text:"Global Parts Co bid: <strong>$8.75/u · 6 days</strong>"},
    {icon:"💬", text:"FastShip Inc bid: <strong>$9.10/u · 2 days</strong>"},
    {icon:"🧠", text:"Muse evaluated: cost vs lead-time vs reliability"},
    {icon:"✅", text:"Selected: <strong>Apex Logistics</strong> — best score"},
  ];

  function a2aLogHTML() {
    return `<div style="margin-bottom:10px;">
      <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-bottom:6px;">A2A NEGOTIATION LOG · SAM</div>
      ${a2aLog.map(l=>`<div style="font-size:11.5px;padding:3px 0;display:flex;gap:7px;border-bottom:1px solid rgba(48,54,61,.5);">
        <span>${l.icon}</span><span>${l.text}</span></div>`).join("")}
    </div>`;
  }

  async function triggerAgentRestock() {
    if (isNegotiating) return;
    isNegotiating = true;
    setStatus("SAM negotiating with suppliers…", true);
    // Show spinner while SAM/Muse evaluates bids
    openPanel(`<div class="card__header">
      <span class="card__title">🤖 A2A Procurement</span>
      <span class="card__badge">SAM · muse-spark-1.3</span></div>
      <div class="card__body">
        <div style="font-size:12px;color:var(--muted);text-align:center;padding:16px 0;">
          ⏳ SAM broadcasting RFQ to suppliers…
        </div>
      </div>`, "accent");
    let negotiation = null;
    try {
      const res = await fetch("/api/vr/negotiate", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sku:"Widget-A", qty:500})
      });
      negotiation = await res.json();
      // Update A2A log from server response (real Muse or fallback)
      if (negotiation.log) a2aLog = negotiation.log;
      if (negotiation.draft_po) pendingPO = negotiation.draft_po;
      else pendingPO = {...FALLBACK_DRAFT_PO};
    } catch {
      pendingPO = {...FALLBACK_DRAFT_PO};
    } finally { isNegotiating = false; }
    const badge = negotiation?.powered_by_muse ? "SAM · Muse Live 🟢" : "SAM · muse-spark-1.3";
    renderPoCard(pendingPO, badge);
    setStatus('PO ready · Approve or reject', true);
  }

  function renderPoCard(po, badge) {
    badge = badge || "SAM · muse-spark-1.3";
    // A2A log stays visible above the PO
    openPanel(`<div class="card__header">
      <span class="card__title">⏸ Purchase Order</span>
      <span class="card__badge">${po.po_id||"PO-2026-847"}</span></div>
      <div class="card__body">
        ${a2aLogHTML()}
        <div class="card__box">
          <div class="card__row"><span>Supplier</span><strong>${po.supplier}</strong></div>
          <div class="card__row"><span>Item</span><strong>${po.sku} × ${po.qty} u</strong></div>
          <div class="card__row"><span>Unit</span><strong>$${Number(po.unit_price).toFixed(2)}</strong></div>
          <div class="card__row"><span>Total</span><strong style="color:var(--ok)">$${Number(po.total).toLocaleString()}</strong></div>
          <div class="card__row"><span>Delivery</span><strong>${po.delivery_days} days</strong></div>
        </div>
        <div class="card__actions">
          <button class="btn btn-primary interactive" id="btn-approve-po">✅ Approve PO</button>
          <button class="btn btn-danger interactive" id="btn-reject-po">✗ Reject</button>
        </div>
      </div>`, "warn");
    document.getElementById("btn-approve-po")?.addEventListener("click", approveAgentPO);
    document.getElementById("btn-reject-po")?.addEventListener("click", rejectAgentPO);
  }

  function approveAgentPO() {
    if (!pendingPO) return;
    approvedPO = {...pendingPO}; pendingPO = null;
    invoiceLocked = false;
    // Widget-A stays EMPTY visually until invoice is verified & paid
    // Just show "awaiting invoice" hint on the bin
    bins[0].status = "awaiting-invoice"; bins[0].color = "#aa44ff";
    renderDesktopBins();
    update3DBin("Widget-A", 0, "awaiting-invoice", "#aa44ff");
    setStatus("PO approved · Tap Widget-A to validate invoice");
    openPanel(`<div class="card__header">
      <span class="card__title">✅ PO Approved</span>
      <span class="card__badge">AWAITING DELIVERY</span></div>
      <div class="card__body">
        <div class="card__line">Order locked with <strong>${approvedPO.supplier}</strong> — 500× Widget-A</div>
        <div class="card__line" style="color:var(--warn);margin-top:6px">
          ⏳ Widget-A stays empty until supplier invoice is verified.
        </div>
        <div class="card__line" style="color:var(--accent);margin-top:4px">
          👉 Tap Widget-A to validate supplier invoice against PO.
        </div>
        <div class="card__actions">
          <button class="btn btn-accent interactive" id="btn-open-inv">🧾 Validate Invoice</button>
          <button class="btn btn-ghost interactive" id="btn-close-after-approve">Close</button>
        </div>
      </div>`, "ok");
    document.getElementById("btn-open-inv")?.addEventListener("click", onInvoicePinch);
    document.getElementById("btn-close-after-approve")?.addEventListener("click", closePanel);
  }

  function rejectAgentPO() {
    pendingPO = null;
    setStatus("PO rejected · Ready");
    openPanel(`<div class="card__header">
      <span class="card__title">❌ PO Rejected</span>
      <span class="card__badge">CANCELLED</span></div>
      <div class="card__body">
        <div class="card__line">No order placed. Tap Widget-A to retry.</div>
        <div class="card__actions">
          <button class="btn btn-ghost interactive" id="btn-close-reject">Close</button>
        </div>
      </div>`, "danger");
    document.getElementById("btn-close-reject")?.addEventListener("click", closePanel);
  }

  async function onInvoicePinch() {
    if (invoiceLocked) { setStatus("Approve PO first", true); return; }
    setStatus("Scanning invoice with Muse Image…");
    try {
      const res = await fetch("/api/vr/invoice-scan/demo", {method:"POST"});
      activeInvoice = await res.json();
    } catch { activeInvoice = {...FALLBACK_INVOICE}; }
    openPanel(`<div class="card__header">
      <span class="card__title">🧾 Invoice INV-2026-847</span>
      <span class="card__badge">muse-image-1.0</span></div>
      <div class="card__body">
        <div class="card__box">
          <div class="card__row"><span>Vendor</span><strong>${activeInvoice.supplier}</strong></div>
          <div class="card__row"><span>Item</span><strong>500× Widget-A @ $8.20</strong></div>
          <div class="card__row"><span>Total</span><strong style="color:var(--ok)">${activeInvoice.total}</strong></div>
          <div class="card__row"><span>PO Match</span><strong style="color:var(--ok)">✓ 100%</strong></div>
        </div>
        <div class="card__actions">
          <button class="btn btn-primary interactive" id="btn-pay-inv">💳 Verify & Pay</button>
          <button class="btn btn-ghost interactive" id="btn-close-inv">Close</button>
        </div>
      </div>`, "accent");
    document.getElementById("btn-pay-inv")?.addEventListener("click", verifyInvoicePayment);
    document.getElementById("btn-close-inv")?.addEventListener("click", closePanel);
  }

  async function verifyInvoicePayment() {
    if (!activeInvoice) await onInvoicePinch();
    setStatus("Releasing payment…");
    // Show inbound state while "payment clears"
    bins[0].status = "inbound"; bins[0].color = "#aa44ff";
    renderDesktopBins(); update3DBin("Widget-A", 500, "inbound", "#aa44ff");
    let newQty = 500; // correct: ordered 500, receive 500
    try {
      const res = await fetch("/api/vr/invoice-pay/demo", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({po:approvedPO||FALLBACK_DRAFT_PO, invoice:activeInvoice})
      });
      const data = await res.json();
      if (data.newQty != null) newQty = data.newQty;
    } catch {}
    bins[0].qty = newQty; bins[0].status = "ok"; bins[0].color = "#00ff88";
    renderDesktopBins(); update3DBin("Widget-A", newQty, "ok", "#00ff88");
    setStatus(`✅ Paid · Delivery inbound · Widget-A: ${newQty} u`);
    openPanel(`<div class="card__header">
      <span class="card__title">💸 Payment Released</span>
      <span class="card__badge">COMPLETE</span></div>
      <div class="card__body">
        <div class="card__line">✅ 3-way match: PO ↔ Invoice ↔ GRN verified</div>
        <div class="card__line" style="color:var(--accent);font-size:11px;margin-top:2px">muse-image-1.0 · invoice scan · 100% PO match</div>
        <div class="card__line" style="color:var(--muted);font-size:11.5px;margin-top:4px">PO-2026-847 · Apex Logistics · $4,100.00</div>
        <div class="card__line" style="color:var(--ok);font-weight:600;margin-top:8px">
          📦 Delivery inbound · Widget-A: ${newQty} units
        </div>
        <div class="card__actions">
          <button class="btn btn-ghost interactive" id="btn-close-done">Done</button>
        </div>
      </div>`, "ok");
    document.getElementById("btn-close-done")?.addEventListener("click", closePanel);
  }

  async function resetDemo() {
    closePanel(); // always close any open panel first
    try { await fetch("/api/vr/reset-demo",{method:"POST"}); } catch {}
    bins = JSON.parse(JSON.stringify(INITIAL_BINS));
    pendingPO=null; approvedPO=null; activeInvoice=null;
    invoiceLocked=true; isNegotiating=false;
    clearVoiceFeedback(); closePanel();
    renderDesktopBins();
    build3DShelf(); // rebuild 3D shelf to initial state
    setStatus("Demo reset · Ready");
  }

  // ── Voice ─────────────────────────────────────────────────────────────────
  function showVoiceFeedback(transcript, intent, label) {
    voiceFB.innerHTML = `<div class="voice-feedback__heard">🎙️ "${transcript}"</div>
      <div class="voice-feedback__intent">⚡ ${label}</div>`;
    voiceFB.classList.add("visible");
  }
  function clearVoiceFeedback() { voiceFB.classList.remove("visible"); voiceFB.innerHTML=""; }

  function fallbackIntent(t) {
    t = t.toLowerCase();
    if (/approve|accept|confirm/.test(t)) return "approve_po";
    if (/reject|cancel|decline/.test(t)) return "reject_po";
    if (/pay|payment|release|settle/.test(t)) return "pay_invoice";
    if (/invoice|bill/.test(t)) return "show_invoice";
    if (/restock|widget|order|replenish/.test(t)) return "restock";
    return "unknown";
  }

  async function resolveIntent(transcript) {
    try {
      const res = await fetch("/api/vr/interpret-voice",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({transcript})
      });
      const data = await res.json();
      if (data?.intent && data.intent!=="unknown") return data.intent;
    } catch {}
    return fallbackIntent(transcript);
  }

  function handleIntent(intent) {
    if (intent==="restock") triggerAgentRestock();
    else if (intent==="approve_po") approveAgentPO();
    else if (intent==="reject_po") rejectAgentPO();
    else if (intent==="show_invoice") onInvoicePinch();
    else if (intent==="pay_invoice") verifyInvoicePayment();
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition=null, listening=false;
  const btnMic = document.getElementById("btn-mic");
  const btnReset = document.getElementById("btn-reset");

  if (SR) {
    recognition = new SR();
    recognition.lang="en-US"; recognition.interimResults=false;
    recognition.onstart = () => { listening=true; clearVoiceFeedback(); btnMic.textContent="⏹ Listening…"; };
    recognition.onresult = async e => {
      const transcript = e.results[e.results.length-1][0].transcript;
      const intent = await resolveIntent(transcript);
      showVoiceFeedback(transcript, intent, INTENT_LABELS[intent]||intent);
      handleIntent(intent);
    };
    recognition.onend = () => { listening=false; btnMic.textContent="🎤 Voice"; };
    recognition.onerror = () => { listening=false; btnMic.textContent="🎤 Voice"; };
  }

  btnMic.addEventListener("click", () => {
    if (!recognition) { triggerAgentRestock(); return; }
    if (listening) { recognition.stop(); clearVoiceFeedback(); }
    else recognition.start();
  });
  btnReset.addEventListener("click", resetDemo);
  document.getElementById("btn-enter-ar").addEventListener("click", startARSession);

  if (!navigator.xr) setStatus("2D Fallback · Tap Widget-A to begin");
  </script>
</body>
</html>
