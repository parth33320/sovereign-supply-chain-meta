name: Rubric Check
on: [pull_request]

jobs:
  rubric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check CODING_RUBRIC.md exists
        run: test -f docs/CODING_RUBRIC.md

      - name: Check decision log exists for this PR
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"
          ls docs/decisions/
          # Warn if no new decision log added
          git diff --name-only origin/main...HEAD | \
          grep "docs/decisions/" || \
          echo "WARNING: No decision log found for this PR"

      - name: Check no hardcoded API keys
        run: |
          if grep -r "LLM_[A-Za-z0-9_]*" --include="*.py" \
          --exclude-dir=".git" .; then
            echo "FAIL: Hardcoded API key pattern found"
            sh -c "exit 1"
          fi

      - name: Check no dead imports from removed features
        run: |
          if grep -r "from worker import\|from celery.result\|from generate_synthetic_load" \
          --include="*.py" --exclude-dir=".git" \
          --exclude-dir="tests" .; then
            echo "FAIL: Dead import from removed feature found"
            sh -c "exit 1"
          fi

      - name: Check .env.example exists
        run: test -f .env.example

      - name: Check zero popups (st.error, st.warning, st.success, st.toast) in UI
        run: |
          if grep -n -E "st\.(error|warning|success|toast|exception)\(" app.py; then
            echo "FAIL: Popup/toast calls found in app.py. All notifications must use chat bubbles or activity log."
            exit 1
          fi

      - name: Check zero hardcoded environment or platform strings in UI
        run: |
          if grep -n -E "(Meta Foundation Cloud|v1\.6\.0-enterprise|Tenant_A)" app.py; then
            echo "FAIL: Hardcoded environment/platform/tenant strings found in app.py."
            exit 1
          fi

      - name: Check zero sidebar navigation labels in UI
        run: |
          if grep -n -E "st\.sidebar\.radio\(|st\.sidebar\.markdown\(\"\#\#\# Navigation\"" app.py; then
            echo "FAIL: Sidebar navigation labels or radio found in app.py."
            exit 1
          fi
