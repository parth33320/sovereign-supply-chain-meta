name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Database
      run: python init_db.py

    - name: Run Test Suite
    - name: Run Supply Chain Eval Suite
      run: |
        DEMO_MODE=1 PYTHONPATH=. python -m pytest tests/ \
          --ignore=tests/test_meta_smoke.py \
          --ignore=tests/test_postgres_smoke.py \
          -q --tb=short --timeout=30
      env:
        DEMO_MODE: "1"
