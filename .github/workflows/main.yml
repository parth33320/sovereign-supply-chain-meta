name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Python deps
      run: pip install -r requirements.txt

    - name: Install Node deps & build frontend
      run: cd frontend && npm ci && npm run build

    - name: Initialize Database
      run: python init_db.py

    - name: Install Playwright browsers
      run: playwright install chromium --with-deps

    - name: Run Supply Chain Eval Suite
      run: |
        DEMO_MODE=1 PYTHONPATH=. python -m pytest tests/ \
          --ignore=tests/test_meta_smoke.py \
          --ignore=tests/test_postgres_smoke.py \
          -q --tb=short --timeout=30
      env:
        DEMO_MODE: "1"

    - name: Check no Streamlit popup calls in app.py
      run: |
        grep -n "st\.error\|st\.warning\|st\.success\|st\.toast" \
          app.py && echo "FAIL" && false || echo "PASS"
